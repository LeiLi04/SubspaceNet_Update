<!DOCTYPE html>
<!--
    THIS IS A TEMPLATE THAT SHOULD BE USED EVERY TIME AND MODIFIED.
    WHAT TO KEEP:
    ✓ Overall structure (header, sidebar, main content)
    ✓ Anthropic branding (colors, fonts, layout)
    ✓ Seed navigation section (always include this)
    ✓ Self-contained artifact (everything inline)

    WHAT TO CREATIVELY EDIT:
    ✗ The p5.js algorithm (implement YOUR vision)
    ✗ The parameters (define what YOUR art needs)
    ✗ The UI controls (match YOUR parameters)

    Let your philosophy guide the implementation.
    The world is your oyster - be creative!
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Art Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 8px;
        }

        /* Parameter Controls */
        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 64px;
            text-align: right;
        }

        /* Color Pickers */
        .color-group {
            margin-bottom: 16px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        /* Buttons */
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
        }

        /* Responsive - Stack on mobile */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .canvas-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Star Tidal Atlas</h1>
            <div class="subtitle">A seeded stellar flow system where order emerges from orbital shear, noise drift, and long-memory light.</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <div class="button-row">
                    <button class="button tertiary" onclick="randomSeedAndUpdate()">↻ Random</button>
                    <button class="button secondary" onclick="updateSeed()">Go</button>
                </div>
            </div>

            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Star Count</label>
                    <div class="slider-container">
                        <input type="range" id="starCount" min="800" max="8000" step="100" value="3600" oninput="updateParam('starCount', this.value)">
                        <span class="value-display" id="starCount-value">3600</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Field Scale</label>
                    <div class="slider-container">
                        <input type="range" id="fieldScale" min="0.0008" max="0.02" step="0.0002" value="0.0046" oninput="updateParam('fieldScale', this.value)">
                        <span class="value-display" id="fieldScale-value">0.0046</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Drift Speed</label>
                    <div class="slider-container">
                        <input type="range" id="driftSpeed" min="0.2" max="2.4" step="0.1" value="1.1" oninput="updateParam('driftSpeed', this.value)">
                        <span class="value-display" id="driftSpeed-value">1.1</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Swirl Force</label>
                    <div class="slider-container">
                        <input type="range" id="swirlForce" min="0.1" max="2.2" step="0.1" value="1.3" oninput="updateParam('swirlForce', this.value)">
                        <span class="value-display" id="swirlForce-value">1.3</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Core Pull</label>
                    <div class="slider-container">
                        <input type="range" id="corePull" min="0.02" max="0.4" step="0.01" value="0.14" oninput="updateParam('corePull', this.value)">
                        <span class="value-display" id="corePull-value">0.14</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Twinkle</label>
                    <div class="slider-container">
                        <input type="range" id="twinkle" min="0" max="1" step="0.01" value="0.42" oninput="updateParam('twinkle', this.value)">
                        <span class="value-display" id="twinkle-value">0.42</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Trail Memory</label>
                    <div class="slider-container">
                        <input type="range" id="trailMemory" min="2" max="40" step="1" value="11" oninput="updateParam('trailMemory', this.value)">
                        <span class="value-display" id="trailMemory-value">11</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Colors</h3>

                <div class="color-group">
                    <label>Deep Sky</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#0b1026" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#0b1026</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Cold Star</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#8ab7ff" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#8ab7ff</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Warm Star</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#ffd79f" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#ffd79f</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button secondary" onclick="regenerate()">Regenerate</button>
                    <button class="button" onclick="resetParameters()">Reset</button>
                </div>
                <button class="button tertiary" onclick="downloadPng()">Download PNG</button>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing generative art...</div>
            </div>
        </div>
    </div>

    <script>
        let params = {
            seed: 12345,
            starCount: 3600,
            fieldScale: 0.0046,
            driftSpeed: 1.1,
            swirlForce: 1.3,
            corePull: 0.14,
            twinkle: 0.42,
            trailMemory: 11,
            colorPalette: ['#0b1026', '#8ab7ff', '#ffd79f']
        };

        let defaultParams = {...params};

        let stars = [];
        let canvas;
        let initialized = false;

        function setup() {
            canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            pixelDensity(1);
            strokeCap(ROUND);
            initializeSystem();

            const loader = document.querySelector('.loading');
            if (loader) {
                loader.style.display = 'none';
            }
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);

            stars = [];
            const cx = width * 0.5;
            const cy = height * 0.5;

            for (let i = 0; i < params.starCount; i++) {
                stars.push(new Star(i, cx, cy));
            }

            const bg = hexToRgb(params.colorPalette[0]);
            background(bg.r, bg.g, bg.b);
            initialized = true;
        }

        function draw() {
            if (!initialized) {
                return;
            }

            const bg = hexToRgb(params.colorPalette[0]);
            noStroke();
            fill(bg.r, bg.g, bg.b, constrain(params.trailMemory, 1, 60));
            rect(0, 0, width, height);

            for (let i = 0; i < stars.length; i++) {
                stars[i].step();
                stars[i].render();
            }
        }

        class Star {
            constructor(id, cx, cy) {
                this.id = id;

                const bandTilt = map(noise(params.seed * 0.002, 9.3), 0, 1, -PI / 4, PI / 4);
                const spread = randomGaussian(0, height * 0.14);
                const along = random(-width * 0.58, width * 0.58);

                const x = cx + cos(bandTilt) * along - sin(bandTilt) * spread;
                const y = cy + sin(bandTilt) * along + cos(bandTilt) * spread;

                this.pos = createVector(x, y);
                this.prev = this.pos.copy();
                this.vel = p5.Vector.random2D().mult(random(0.1, 0.8));
                this.mass = random(0.7, 1.5);
                this.phase = random(TWO_PI);
                this.radiusBias = random(0.85, 1.2);
            }

            flowVector(x, y) {
                const cx = width * 0.5;
                const cy = height * 0.5;

                const dx = x - cx;
                const dy = y - cy;
                const r = sqrt(dx * dx + dy * dy) + 0.0001;
                const rn = r / (0.5 * min(width, height));

                const baseAngle = atan2(dy, dx) + HALF_PI;
                const turbulence = map(
                    noise(x * params.fieldScale, y * params.fieldScale, params.seed * 0.013),
                    0,
                    1,
                    -0.95,
                    0.95
                );

                const siderealDrift = 0.22 * sin(frameCount * 0.0023 + params.seed * 0.00017);
                const swirl = params.swirlForce / (0.2 + rn * 2.1);
                const theta = baseAngle + turbulence + siderealDrift;

                const tangent = p5.Vector.fromAngle(theta).mult(swirl);
                const toCenter = createVector(cx - x, cy - y).setMag(params.corePull * (0.35 + rn));

                return tangent.add(toCenter);
            }

            step() {
                this.prev.set(this.pos);

                const field = this.flowVector(this.pos.x, this.pos.y);
                const wander = p5.Vector.fromAngle(
                    TWO_PI * noise(this.id * 0.013, frameCount * 0.002 + params.seed * 0.001)
                ).mult(0.02);

                this.vel.add(field.mult(params.driftSpeed * this.mass));
                this.vel.add(wander);
                this.vel.mult(0.94);
                this.vel.limit(2.8);

                this.pos.add(this.vel);

                if (this.outOfBounds()) {
                    this.reseed();
                }
            }

            render() {
                const cx = width * 0.5;
                const cy = height * 0.5;
                const d = dist(this.pos.x, this.pos.y, cx, cy);
                const dn = constrain(d / (0.52 * min(width, height)), 0, 1);

                const cool = color(params.colorPalette[1]);
                const warm = color(params.colorPalette[2]);
                const shade = lerpColor(cool, warm, pow(dn, 0.75));

                const pulse = 0.55 + 0.45 * sin(frameCount * (0.01 + params.twinkle * 0.03) + this.phase);
                const alpha = 26 + pulse * 120 * (1 - 0.45 * dn);
                const weight = 0.4 + this.radiusBias * (0.2 + pulse * 1.2);

                stroke(red(shade), green(shade), blue(shade), alpha);
                strokeWeight(weight);
                line(this.prev.x, this.prev.y, this.pos.x, this.pos.y);
            }

            outOfBounds() {
                return (
                    this.pos.x < -20 ||
                    this.pos.x > width + 20 ||
                    this.pos.y < -20 ||
                    this.pos.y > height + 20
                );
            }

            reseed() {
                const cx = width * 0.5;
                const cy = height * 0.5;
                const a = random(TWO_PI);
                const r = random(min(width, height) * 0.16, min(width, height) * 0.47);

                this.pos.set(cx + cos(a) * r, cy + sin(a) * r);
                this.prev.set(this.pos);
                this.vel = p5.Vector.random2D().mult(random(0.1, 0.8));
                this.phase = random(TWO_PI);
            }
        }

        function updateParam(paramName, value) {
            let parsedValue;

            if (paramName === 'starCount' || paramName === 'trailMemory') {
                parsedValue = parseInt(value, 10);
            } else {
                parsedValue = parseFloat(value);
            }

            params[paramName] = parsedValue;
            document.getElementById(paramName + '-value').textContent = String(parsedValue);

            if (paramName === 'trailMemory') {
                return;
            }

            initializeSystem();
        }

        function updateColor(colorId, value) {
            const idx = colorId === 'color1' ? 0 : (colorId === 'color2' ? 1 : 2);
            params.colorPalette[idx] = value;
            document.getElementById(colorId + '-value').textContent = value;
            initializeSystem();
        }

        function regenerate() {
            initializeSystem();
        }

        function downloadPng() {
            saveCanvas(canvas, 'starfield-seed-' + params.seed, 'png');
        }

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            const input = document.getElementById('seed-input');
            const newSeed = parseInt(input.value, 10);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = {...defaultParams};

            const scalarKeys = [
                'starCount',
                'fieldScale',
                'driftSpeed',
                'swirlForce',
                'corePull',
                'twinkle',
                'trailMemory'
            ];

            for (let i = 0; i < scalarKeys.length; i++) {
                const key = scalarKeys[i];
                document.getElementById(key).value = params[key];
                document.getElementById(key + '-value').textContent = String(params[key]);
            }

            document.getElementById('color1').value = params.colorPalette[0];
            document.getElementById('color1-value').textContent = params.colorPalette[0];
            document.getElementById('color2').value = params.colorPalette[1];
            document.getElementById('color2-value').textContent = params.colorPalette[1];
            document.getElementById('color3').value = params.colorPalette[2];
            document.getElementById('color3-value').textContent = params.colorPalette[2];

            updateSeedDisplay();
            initializeSystem();
        }

        function hexToRgb(hex) {
            const clean = hex.replace('#', '');
            return {
                r: parseInt(clean.substring(0, 2), 16),
                g: parseInt(clean.substring(2, 4), 16),
                b: parseInt(clean.substring(4, 6), 16)
            };
        }

        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
