[project]
name = "subspacenet-update"
version = "0.1.0"
description = "Hydra and Lightning based DOA training/evaluation pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.20.0",
  "pandas>=1.5.0",
  "scipy>=1.7.0",
  "matplotlib>=3.4.0",
  "pydantic>=1.8.0",
  "PyYAML>=6.0",
  "click>=8.0.0",
  "torch>=1.9.0",
  "tqdm>=4.62.0",
  "hydra-core>=1.3.0",
  "pytorch-lightning>=2.0.0",
  "h5py>=3.8.0",
  "scikit-learn>=1.2.0",
  "ipykernel>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
markers = [
  "integration: integration and smoke tests",
]
